[package]
name = "vnpen-engine"
version = "0.1.0"
edition = "2021"
description = "VNPen task layer: implements the frontend <-> task layer contract v1 over local HTTP/SSE"
license = "Apache-2.0"

[lib]
name = "vnpen_engine"
path = "src/lib.rs"

[[bin]]
name = "vnpen-engine"
path = "src/bin/vnpen-engine.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["cors", "set-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures = "0.3"
async-stream = "0.3"
dashmap = "6"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
regex = "1"
strsim = "0.11"
sha2 = "0.10"
hex = "0.4"
sysinfo = "0.37"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
once_cell = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
